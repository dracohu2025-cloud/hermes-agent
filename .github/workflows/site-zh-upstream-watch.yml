name: Chinese Docs Site Retired

on:
  workflow_dispatch:

jobs:
  migration-notice:
    runs-on: ubuntu-latest
    steps:
      - name: Write retirement summary
        run: |
          {
            echo "## 中文文档站已退役"
            echo
            echo "请使用官方中文文档：https://hermes-agent.nousresearch.com/docs/zh-Hans/"
          } >> "${GITHUB_STEP_SUMMARY}"
